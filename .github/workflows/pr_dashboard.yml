name: PR Dashboard Generator
on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install PyGithub jinja2
      
      - name: Generate Dashboard Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python .github/scripts/generate_dashboard.py
      
      - name: Commit and Push Dashboard
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/pr_dashboard.html docs/dashboard_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update PR dashboard [skip ci]" && git push)

