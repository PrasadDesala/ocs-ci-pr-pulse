name: PR Dashboard Generator
on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours to avoid rate limits
  workflow_dispatch:
  # Temporarily disabled push trigger to avoid rate limits during development
  # push:
  #   branches:
  #     - main

permissions:
  contents: write
  pull-requests: read
  pages: write
  id-token: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all history for rebase to work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install PyGithub jinja2
      
      - name: Generate Dashboard Data
        env:
          GITHUB_TOKEN: ${{ secrets.PR_DASHBOARD_TOKEN }}
          REPO_NAME: red-hat-storage/ocs-ci
        run: |
          python .github/scripts/generate_dashboard.py
      
      - name: Commit and Push Dashboard
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/pr_dashboard.html docs/dashboard_data.json docs/dashboard_history.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to dashboard files, skipping commit"
            exit 0
          fi

          # Commit the changes
          git commit -m "Update PR dashboard [skip ci]"

          # Pull latest changes and rebase our commit on top
          git fetch origin main
          git rebase origin/main || {
            echo "Rebase failed, trying reset strategy..."
            git rebase --abort
            git reset --soft origin/main
            git commit -m "Update PR dashboard [skip ci]"
          }

          # Push with force-with-lease (safe force push)
          git push --force-with-lease origin HEAD:main

  deploy:
    needs: generate-dashboard
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
