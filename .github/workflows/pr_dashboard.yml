name: PR Dashboard Generator
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read
  pages: write
  id-token: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install PyGithub jinja2
      
      - name: Generate Dashboard Data
        env:
          GITHUB_TOKEN: ${{ secrets.PR_DASHBOARD_TOKEN }}
          REPO_NAME: red-hat-storage/ocs-ci
        run: |
          python .github/scripts/generate_dashboard.py
      
      - name: Commit and Push Dashboard
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/pr_dashboard.html docs/dashboard_data.json docs/dashboard_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update PR dashboard [skip ci]" && git push)

  deploy:
    needs: generate-dashboard
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
